name: Publish Provider Package

# The template's original version of this workflow called
# crossplane-contrib/provider-workflows' reusable publish-provider.yml, which
# publishes to xpkg.upbound.io / the crossplane-contrib GHCR org using
# XPKG_MIRROR_TOKEN/XPKG_MIRROR_ACCESS_ID secrets this repo doesn't have and
# isn't meant to have - this is a personal fork, not an Upbound-marketplace
# package. Replaced with a repo-owned workflow that builds the same real
# multi-arch xpkg (via this repo's own vendored build system, same
# `make build.all` ci.yml already uses) and pushes it to this repo's own
# ghcr.io/jfillman/provider-infisical, the same GHCR-under-this-account
# pattern already proven working for function-rollout-watcher in the
# airframe repo.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to use while publishing the package (e.g. v0.1.0)"
        default: ''
        required: false

env:
  DOCKER_BUILDX_VERSION: 'v0.34.1'

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Fetch History
        run: git fetch --prune --unshallow

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Vendor Dependencies
        run: make vendor vendor.check

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch package
        run: make -j2 build.all
        env:
          BUILD_ARGS: "--load"
          VERSION: ${{ github.event.inputs.version }}

      - name: Publish to GHCR
        run: make publish.artifacts
        env:
          VERSION: ${{ github.event.inputs.version }}
